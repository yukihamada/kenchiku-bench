[workspace]

[package]
name = "engine-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bim-core = { path = "../../mu-house/crates/bim-core" }
houki-engine = { path = "../../mu-house/crates/houki-engine" }

[[bin]]
name = "far_check"
